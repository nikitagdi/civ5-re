# civ5-re analysis profile. Read by Civ5reOptions.java; its sha256 is part of the cache key.
# Lines: "<analysis option> = <value>". Option names are Ghidra's, spaces included; "@" keys pin the loader.
# Options of analyzers that do not apply to the program (e.g. DWARF without DWARF) are skipped with a log line.

@processor = x86:LE:32:default
@cspec = gcc

Decompiler Parameter ID = true
Decompiler Parameter ID.Analysis Clear Level = ANALYSIS
Decompiler Parameter ID.Commit Data Types = true
Decompiler Parameter ID.Commit Void Return Values = false
Decompiler Parameter ID.Analysis Decompiler Timeout (sec) = 60

Demangler GNU = true
Demangler GNU.Apply Function Signatures = false
Demangler GNU.Apply Function Calling Conventions = false

Function ID = false
DWARF = false
Aggressive Instruction Finder = false
