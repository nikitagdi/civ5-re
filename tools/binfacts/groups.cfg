# Group rules, first match wins. Line: <group> <target> <regex>
# target: cpp = C++ symbols, matched on the qualified name without template arguments;
#         c = non-mangled symbols, matched on the name;
#         key / mangled / demangled = any symbol, matched on that form.
# Every symbol must end up in a group; `binfacts report` shows the top prefixes of each group.
# Firaxis C++ is the last C++ rule (everything not claimed above); C names not claimed
# above fall to aspyr (its Win32/CRT/DirectX/GL compatibility layer).

# --- std (libc++ / libc++abi) ---
std        cpp  ^(std|__cxxabiv\d*|__gnu_cxx)(::|$)

# --- libraries with C++ names ---
icu        cpp  ^icu_\d+(::|$)
granny     cpp  ^granny(_\w+)?(::|$)
thirdparty cpp  ^(tbb|Json|CSmtp|ECSmtp|CCall\w*|ENet\w*|enet_\w+|rapidxml|RapidXML\w*|MD5\w*|PrintMD5|base64_\w+|RADScale\w*|ConvertU(TF|CS4)\w+)(::|$)

# --- C names ---
granny     c    ^_?Granny
granny     c    ^(Samplers|NodeRegistry|SummedMatrix|Transform|BoneDeformerTable|BoneDeformerTableCount)$
icu        c    _44$
icu        c    ^icudt44_dat$
lua        c    ^lua(L|open)?_
crt        c    ^(_init|_fini|_start|_edata|_end|__bss_start|__data_start|data_start|__dso_handle|__libc_csu_\w+|_IO_stdin_used|__TMC_END__|__gmon_start__)$
crt        c    ^(stdin|stdout|stderr|timezone|tzname|__timezone|__tzname|___?security_\w+|_alloca_probe\w*|_chkstk)$
thirdparty c    ^(SDL_|IMG_|sqlite3|_?[Bb]ink|bink_|is_bink|to_BinkTC|from_BinkTC|BinkTC|ExpandBink|ExpandBundleSizes|LowBinkDoFrameAsync|\?\?_C__|\?radfft)
thirdparty c    ^(inflate|deflate|adler32|crc32|_tr_|zlib|zError|z_errmsg|zcalloc|zcfree|_dist_code|_length_code|get_crc_table|get_slice_range)
thirdparty c    ^(Lzma|Sz|Bcj2|Crc(Calc|GenerateTable|Update)|InFile_|OutFile_|File(In|Out|SeqIn|SeqOut)Stream_|File_|LookInStream_|LookToRead_|SeqInStream_|SecTo|Buf_|x86_Convert|k7zSignature|kMask|Arith|LZ_|RAD|rad|MP2P_|CPU_|x86cpuid|cpu_features|real40000000|masknegfloat|_real_)
thirdparty c    ^(mspace_|create_mspace|destroy_mspace|bpopmalloc|popmalloc|pushmalloc|libgmalloc_)
thirdparty c    ^(Fast\w*[IF]DCT|Fast\w*Quantize|fDWT|iDWT|fHarr|iHarr|ReadBP|WriteBP|LenBP|VarBits|YUV|RGB|ARGB|if\w*quantlevels|Height_2x|BlitG|BlitS|plane_decode|limit_length|setup_dither|setup_scaling|checkyc|dosilence|check_for_pending_io|start_do_frame|end_do_frame|update_blit_specifics|halfp2|doubles2halfp|singles2halfp|frac(2)?$)
aspyr      c    ^(g_(hWnd|gdiplusToken|threadID|uiErrorMode|bErrorBox)|s_(MSHeap|hHeap)|gASL|gMac|gAttribEnabled|gCachedFiles|gDisp|gMachineRegistry|gRegistry|gSaveVisRgn|gSprite|gTimerQueue|gUserRegistry)
firaxis    c    ^(_g_|g_|s_|gFSteam|gSharedBackgroundLoader|gs_Depth|_?frk|FSBA|FJob|FLua|FGr|FString[AW]_|cv[A-Z]|bRegistered|m_aStrategic|sgLua|szMods|ms_|JOB_EVENT_|TEXTURE_PATHS$|ZONEPROPERTY_)
firaxis    c    ^(Get(FileSystemMgr|LogFileMgr|SmallObjectAllocator\w*|TempHeap)|PeekLogFileMgr|SteamAPIDebugTextHook|DeviceList|command_list|IdentifierCharacters|Random[AS]|bytesFromFUTF8|offsetsFromFUTF8|firstByteMark|dxPrinter|fwrite_(big|little|swap)_|GlobalPoseCache|MatchingMemberCallback)$
